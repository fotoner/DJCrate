name: 빌드·테스트

# dev 푸시는 합칠 때마다 오므로 단위 테스트만 돌린다. 전체 검사(릴리스 앱 빌드·커버리지 목표)는 PR·main·수동 실행에서.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
    inputs:
      use_cache:
        description: SwiftPM 캐시 복원·저장(비우고 비교할 때 끔)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 검사 (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON((github.event_name == 'push' && github.ref == 'refs/heads/dev') && '["test"]' || '["coverage", "release"]') }}
    # macOS 27에서 테스트를 실행하는 호스티드 이미지. 근거·제약은 docs/ci.md.
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CHECK_MODE: ${{ matrix.mode }}
    steps:
      - name: 소스 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 실행 환경 확인
        id: toolchain
        run: |
          {
            sw_vers
            xcodebuild -version
            swift --version
            xcrun --sdk macosx --show-sdk-version
          } | tee "$RUNNER_TEMP/djc-toolchain.txt"
          if [[ "$(sw_vers -productVersion | cut -d. -f1)" -lt 27 ]] ||
             [[ "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -lt 27 ]]; then
            echo '::error::macOS 27 실행 환경과 SDK가 있는 러너를 선택하세요.'
            exit 1
          fi
          echo "cache-key=$(shasum -a 256 "$RUNNER_TEMP/djc-toolchain.txt" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          DJC_HOME="$RUNNER_TEMP/djc-home"
          DJC_REKORDBOX_DIR="$RUNNER_TEMP/rekordbox-fixture"
          mkdir -p "$DJC_HOME" "$DJC_REKORDBOX_DIR"
          {
            echo "DJC_HOME=$DJC_HOME"
            echo "DJC_REKORDBOX_DIR=$DJC_REKORDBOX_DIR"
            echo "DJC_CHECK_LOG_ROOT=$RUNNER_TEMP/djc-check-logs"
          } >> "$GITHUB_ENV"

      - name: 검사 스크립트 회귀
        if: matrix.mode != 'release'
        run: python3 scripts/test-check.py 2>&1 | tee "$RUNNER_TEMP/djc-script-tests.log"

      - name: SwiftPM 빌드 캐시
        id: cache
        if: github.event_name != 'workflow_dispatch' || inputs.use_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-v3-${{ matrix.mode }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-v3-${{ matrix.mode }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: 분담한 검사 실행
        id: check
        run: |
          started=$SECONDS
          finish_check() {
            code=$?
            echo "▸ CI 검사 종료: $((SECONDS - started))초, 종료코드 $code"
            exit "$code"
          }
          trap finish_check EXIT
          echo "▸ CI 검사 시작: $CHECK_MODE ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          case "$CHECK_MODE" in
            test) swift test -Xswiftc -enable-incremental-file-hashing 2>&1 | tee "$RUNNER_TEMP/djc-check.log" ;;
            coverage) scripts/check.sh --coverage 2>&1 | tee "$RUNNER_TEMP/djc-check.log" ;;
            release) scripts/check.sh --release 2>&1 | tee "$RUNNER_TEMP/djc-check.log" ;;
            *) echo "::error::알 수 없는 검사 모드: $CHECK_MODE"; exit 2 ;;
          esac

      - name: 검증 결과 요약
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          {
            echo "## $CHECK_MODE 검사"
            echo "검증 단계 결과: $CHECK_OUTCOME ($CHECK_MODE)"
            echo "캐시 정확 키 일치: ${CACHE_HIT:-없음}. 다른 키 복원 여부는 캐시 로그를 확인하세요."
            echo '캐시 복원은 컴파일 재사용을 보장하지 않습니다. 단계별 Build complete 시간과 컴파일 로그를 함께 비교하세요.'
            echo '```text'
            if [[ -f "$RUNNER_TEMP/djc-check.log" ]]; then
              grep -E '▸|✔ Test run|목표 [0-9]+%' "$RUNNER_TEMP/djc-check.log" || true
            else
              echo '검증을 시작하지 못했습니다. 앞 단계의 로그를 확인하세요.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 검사 로그 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-logs-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/djc-toolchain.txt
            ${{ runner.temp }}/djc-script-tests.log
            ${{ runner.temp }}/djc-check.log
            ${{ runner.temp }}/djc-check-logs/**/*.log
            ${{ runner.temp }}/djc-check-logs/**/*.tsv
            ${{ runner.temp }}/djc-check-logs/**/*.txt
          retention-days: 14
          if-no-files-found: warn

  # 기존 필수 체크 이름을 유지하며, 릴리스 실패·취소·미실행도 성공으로 통과시키지 않는다.
  check:
    name: 빌드·테스트·커버리지
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 필수 검사 성공 확인
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "$VERIFY_RESULT" != success ]]; then
            echo "::error::필수 검사 결과: $VERIFY_RESULT"
            exit 1
          fi
