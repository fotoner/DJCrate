name: 빌드·테스트

# 릴리스가 아니면 바뀐 부분에 닿는 시험만 돈다(PR·dev 푸시: scripts/check.sh --changed).
# 전체 검사(릴리스 앱 빌드·전체 시험·커버리지 목표)는 릴리스와 수동 실행에서만 돈다(docs/ci.md "CI 구성").
on:
  push:
    branches: [dev, main, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      use_cache:
        description: SwiftPM 캐시 복원·저장(비우고 비교할 때 끔)
        type: boolean
        default: true
      run_stress:
        description: SQLCipher 처음 열기 스트레스(100 새 프로세스·각 32스레드)
        type: boolean
        default: false

permissions:
  contents: read

# PR은 새 푸시가 앞 실행을 대신한다(늘 PR 기준 브랜치와 비교한다).
# 푸시는 앞 끝과의 차이만 보므로 앞 실행을 취소하지 않는다. 취소하면 그 차이를 아무도 검사하지 않는다.
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  verify:
    name: 검사 (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        # 릴리스(main·release/* 푸시, main 대상·release/* PR)와 수동 실행: coverage·release(선택하면 stress)로 나눈 전체 검사.
        # 그 밖(dev 푸시, dev·작업 브랜치 대상 PR): changed 하나.
        mode: >-
          ${{ fromJSON(
          !(github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')))
          || (github.event_name == 'pull_request' && (github.base_ref == 'main' || startsWith(github.head_ref, 'release/'))))
          && '["changed"]'
          || (github.event_name == 'workflow_dispatch' && inputs.run_stress) && '["coverage", "release", "stress"]'
          || '["coverage", "release"]') }}
    # macOS 27에서 테스트를 실행하는 호스티드 이미지. 근거·제약은 docs/ci.md.
    runs-on: xcode-27
    # 검사 단계 제한(40분)보다 길게 두어 요약·로그 보존·캐시 저장이 돈다. 멈춘 시험은 check.sh가 5분 만에 끝낸다.
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CHECK_MODE: ${{ matrix.mode }}
      # changed·coverage·stress는 같은 계측 디버그 빌드(--enable-code-coverage)라 캐시를 나눠 쓴다.
      CACHE_FAMILY: ${{ matrix.mode == 'release' && 'release' || 'debug-coverage' }}
    steps:
      - name: 소스 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changed는 비교 기준(PR 기준 브랜치·푸시 앞 끝)이 있어야 하므로 기록을 모두 받는다.
          fetch-depth: ${{ matrix.mode != 'changed' && 1 || 0 }}
          persist-credentials: false

      - name: 실행 환경 확인
        id: toolchain
        run: |
          {
            sw_vers
            xcodebuild -version
            swift --version
            xcrun --sdk macosx --show-sdk-version
          } | tee "$RUNNER_TEMP/djc-toolchain.txt"
          if [[ "$(sw_vers -productVersion | cut -d. -f1)" -lt 27 ]] ||
             [[ "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -lt 27 ]]; then
            echo '::error::macOS 27 실행 환경과 SDK가 있는 러너를 선택하세요.'
            exit 1
          fi
          echo "cache-key=$(shasum -a 256 "$RUNNER_TEMP/djc-toolchain.txt" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          DJC_HOME="$RUNNER_TEMP/djc-home"
          DJC_REKORDBOX_DIR="$RUNNER_TEMP/rekordbox-fixture"
          mkdir -p "$DJC_HOME" "$DJC_REKORDBOX_DIR"
          {
            echo "DJC_HOME=$DJC_HOME"
            echo "DJC_REKORDBOX_DIR=$DJC_REKORDBOX_DIR"
            echo "DJC_CHECK_LOG_ROOT=$RUNNER_TEMP/djc-check-logs"
          } >> "$GITHUB_ENV"

      - name: 비교 기준·범위 정하기
        id: base
        if: matrix.mode == 'changed'
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
        run: |
          found=$(scripts/ci-base.sh)
          printf '%s\n' "$found" | tee -a "$GITHUB_OUTPUT"
          base=$(printf '%s\n' "$found" | sed -n 's/^base=//p')
          if [[ -z "$base" ]]; then
            echo "::warning::$(printf '%s\n' "$found" | sed -n 's/^reason=//p'). 전체 검사로 넓힙니다."
            echo "scope=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 빌드·시험이 없는 변경(문서·하네스만)은 캐시를 받지도 저장하지도 않는다.
          scope=$(python3 scripts/affected-tests.py --base "$base" --json |
                  python3 -c 'import json, sys; print(json.load(sys.stdin)["scope"])') || scope=full
          echo "scope=$scope" | tee -a "$GITHUB_OUTPUT"

      - name: SwiftPM 빌드 캐시 받기
        id: cache
        if: steps.base.outputs.scope != 'none' && (github.event_name != 'workflow_dispatch' || inputs.use_cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-v3-${{ env.CACHE_FAMILY }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-v3-${{ env.CACHE_FAMILY }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-v3-${{ env.CACHE_FAMILY }}-${{ steps.toolchain.outputs.cache-key }}-

      # 체크아웃이 모든 파일의 수정 시각을 새로 매겨서, 받은 .build가 있어도 거의 전부 다시 컴파일했다(로컬 74초 → 되돌리면 8초).
      # 캐시를 만든 실행과 내용이 같은 파일만 그때 시각으로 되돌린다. 바뀐 파일은 새 시각 그대로 다시 컴파일한다.
      - name: 소스 수정 시각 되돌리기
        if: steps.cache.outputs.cache-matched-key != ''
        run: python3 scripts/ci-mtimes.py restore

      - name: 분담한 검사 실행
        id: check
        timeout-minutes: 40
        env:
          CHANGED_BASE: ${{ steps.base.outputs.base }}
          BASE_REASON: ${{ steps.base.outputs.reason }}
        run: |
          started=$SECONDS
          finish_check() {
            code=$?
            echo "▸ CI 검사 종료: $((SECONDS - started))초, 종료코드 $code"
            exit "$code"
          }
          trap finish_check EXIT
          echo "▸ CI 검사 시작: $CHECK_MODE ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          case "$CHECK_MODE" in
            changed)
              if [[ -n "$CHANGED_BASE" ]]; then
                scripts/check.sh --changed --base "$CHANGED_BASE" 2>&1 | tee "$RUNNER_TEMP/djc-check.log"
              else
                echo "▸ 전체 검사로 넓힙니다: $BASE_REASON" | tee "$RUNNER_TEMP/djc-check.log"
                scripts/check.sh 2>&1 | tee -a "$RUNNER_TEMP/djc-check.log"
              fi ;;
            coverage) scripts/check.sh --coverage 2>&1 | tee "$RUNNER_TEMP/djc-check.log" ;;
            release) scripts/check.sh --release 2>&1 | tee "$RUNNER_TEMP/djc-check.log" ;;
            stress) scripts/check.sh --stress 2>&1 | tee "$RUNNER_TEMP/djc-check.log" ;;
            *) echo "::error::알 수 없는 검사 모드: $CHECK_MODE"; exit 2 ;;
          esac

      # 검사 스크립트 회귀는 PR·dev 푸시에서 스크립트가 바뀔 때 --changed가 돈다. 릴리스는 짧은 release 러너에서 한 번 더 돈다.
      # 비교 기준이 없어 전체 검사로 넓힌 changed도 돈다: 인자 없는 check.sh는 이것을 돌지 않아 --changed보다 좁아진다.
      - name: 검사 스크립트 회귀
        if: matrix.mode == 'release' || (matrix.mode == 'changed' && steps.base.outputs.base == '')
        timeout-minutes: 10
        run: python3 scripts/test-check.py 2>&1 | tee "$RUNNER_TEMP/djc-script-tests.log"

      # actions/cache의 자동 저장은 잡이 성공할 때만 돌아서 실패가 이어지면 캐시가 생기지 않았다. 시험이 실패해도 빌드는 남긴다.
      - name: 캐시 저장 준비(프로파일 빼기·수정 시각 기록)
        id: cache-prune
        if: >-
          ${{ !cancelled() && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
          && steps.check.outcome != 'skipped'
          && (github.event_name != 'pull_request' || steps.cache.outputs.cache-matched-key == '') }}
        run: |
          if [[ ! -d .build ]]; then
            echo '저장할 .build가 없습니다.'
            exit 0
          fi
          find .build -type d -name codecov -prune -exec rm -rf {} +
          python3 scripts/ci-mtimes.py save
          echo 'save=true' >> "$GITHUB_OUTPUT"

      - name: SwiftPM 빌드 캐시 저장
        if: ${{ !cancelled() && steps.cache-prune.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: 검증 결과 요약
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          CHANGED_BASE: ${{ steps.base.outputs.base }}
          BASE_REASON: ${{ steps.base.outputs.reason }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          {
            echo "## $CHECK_MODE 검사"
            echo "검증 단계 결과: $CHECK_OUTCOME ($CHECK_MODE)"
            if [[ "$CHECK_MODE" == changed ]]; then
              echo "비교 기준: ${CHANGED_BASE:-없음 — $BASE_REASON. 전체 검사로 넓힘}"
            fi
            echo "캐시: 정확 키 일치 ${CACHE_HIT:-없음}, 받은 키 ${CACHE_MATCHED:-없음}"
            echo '```text'
            if [[ -f "$RUNNER_TEMP/djc-check.log" ]]; then
              # 고른 범위(--changed)와 check.sh 끝 요약 블록(멈춤이면 끝나지 않은 시험·스택 포함)
              perl -pe 's/\e\[[0-9;?]*[ -\/]*[@-~]//g' "$RUNNER_TEMP/djc-check.log" |
                awk '/^(범위|기준|넓힘|필터): |^▸ 전체 검사로 넓힙니다/ || /목표 [0-9]+%/ { print } /^── 검사 요약 ──/ { on = 1 } on { print }' || true
            else
              echo '검증을 시작하지 못했습니다. 앞 단계의 로그를 확인하세요.'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 검사 로그 보존
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-logs-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/djc-toolchain.txt
            ${{ runner.temp }}/djc-script-tests.log
            ${{ runner.temp }}/djc-check.log
            ${{ runner.temp }}/djc-check-logs/**/*.log
            ${{ runner.temp }}/djc-check-logs/**/*.tsv
            ${{ runner.temp }}/djc-check-logs/**/*.txt
          retention-days: 14
          if-no-files-found: warn

  # 기존 필수 체크 이름을 유지한다. 그 실행의 모든 검사(changed 하나, 또는 릴리스의 coverage·release·선택한 stress)가
  # 성공해야 통과한다. 실패·취소·미실행은 통과시키지 않는다.
  check:
    name: 빌드·테스트·커버리지
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 필수 검사 성공 확인
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "$VERIFY_RESULT" != success ]]; then
            echo "::error::필수 검사 결과: $VERIFY_RESULT"
            exit 1
          fi
